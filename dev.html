<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"><title>Developer Console</title>
<style>
:root{--a:#19e6ff;--b:#ff9d1a;--bg:#070b14;--pn:#0e1627;--ln:#22314f;--tx:#e6efff;--mu:#8a9bb8;--rd:#ff4d6d;--gn:#8ff0c3}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.4 system-ui,Segoe UI,Roboto,sans-serif}
h1,h2,h3{margin:0}button,input,select,textarea{font:inherit;color:var(--tx)}
button{background:#17223b;border:1px solid var(--ln);padding:8px 14px;border-radius:6px;cursor:pointer}button:hover{border-color:var(--a)}button.pri{background:var(--a);color:#04101a;border-color:var(--a);font-weight:700}button.bad{color:var(--rd)}button.sm{padding:4px 10px;font-size:13px}button.on{border-color:var(--a);color:var(--a)}
input,select,textarea{background:#0a1120;border:1px solid var(--ln);border-radius:6px;padding:8px;width:100%}textarea{font:13px/1.4 ui-monospace,Consolas,monospace;min-height:220px;resize:vertical}input[type=checkbox]{width:auto}input[type=color]{padding:2px;height:36px}
#login{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:12px}#login input{width:240px;text-align:center;font-size:22px;letter-spacing:.3em}#err{color:var(--rd);min-height:20px}
#app{display:none}header{position:sticky;top:0;z-index:20;background:rgba(7,11,20,.96);border-bottom:1px solid var(--ln);padding:10px 16px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}header h1{font-size:18px;color:var(--a);margin-right:8px}#dirty{color:var(--b);font-size:13px}
#nav{display:flex;gap:6px;flex-wrap:wrap;padding:10px 16px;border-bottom:1px solid var(--ln)}#nav button.on{background:var(--a);color:#04101a;font-weight:700}
main{padding:16px;max-width:1200px;margin:auto}section.tab{display:none}section.tab.on{display:block}
.card{background:var(--pn);border:1px solid var(--ln);border-radius:10px;padding:14px;margin-bottom:14px}.card h3{margin-bottom:10px;font-size:16px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:10px}.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
label.f{display:flex;flex-direction:column;gap:3px;font-size:12px;color:var(--mu)}label.f.w2{grid-column:span 2}label.f.w4{grid-column:1/-1}
.muted{color:var(--mu);font-size:13px}table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:6px 8px;border-bottom:1px solid var(--ln);font-size:14px}th{color:var(--mu);font-size:12px}
.pill{display:inline-block;padding:1px 8px;border-radius:10px;font-size:12px;background:#17223b}.pending{color:var(--b)}.approved{color:var(--gn)}.rejected{color:var(--rd)}
.item{border:1px solid var(--ln);border-radius:8px;margin-bottom:8px;background:#0b1324}.item>summary{padding:9px 12px;cursor:pointer;display:flex;gap:10px;align-items:center}.item>div{padding:12px;border-top:1px solid var(--ln)}
.sw{width:14px;height:14px;border-radius:3px;display:inline-block;border:1px solid #fff3}
.pal{display:flex;gap:5px;flex-wrap:wrap}.pal button{display:flex;gap:6px;align-items:center;padding:5px 9px}.pal i{width:14px;height:14px;display:inline-block;border:1px solid #fff4}
#mapwrap{overflow:auto;max-height:70vh;border:1px solid var(--ln);background:#000}#mapcv{display:block;cursor:crosshair;touch-action:none}
#toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:#0e1627;border:1px solid var(--a);padding:10px 18px;border-radius:8px;display:none;z-index:99;max-width:90vw}#toast.bad{border-color:var(--rd)}
.badge{background:var(--rd);color:#fff;border-radius:10px;padding:0 7px;font-size:12px;margin-left:4px}
</style></head><body>
<div id="login"><h1 style="color:var(--a)">DEVELOPER CONSOLE</h1><input id="pin" type="password" inputmode="numeric" placeholder="PIN" autofocus><button class="pri" id="go">SIGN IN</button><div id="err"></div></div>
<div id="app"><header><h1>VECTOR HAVOC · Developer</h1><button class="pri" id="save">Save &amp; Publish</button><button id="discard">Discard changes</button><span id="dirty"></span><span style="flex:1"></span><a href="/" target="_blank" style="color:var(--a)">Open game ↗</a><button id="out">Sign out</button></header>
<div id="nav"></div><main id="main"></main></div><div id="toast"></div>
<script src="vendor/three.min.js"></script><script src="js/models.js"></script><script src="js/dev.js"></script></body></html>
